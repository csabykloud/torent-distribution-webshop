<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare Panou Admin - Torent Distribution</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #064e3b 0%, #065f46 50%, #047857 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            animation: fadeIn 0.4s ease-out;
        }
        .login-header {
            background: #047857;
            color: #ffffff;
            padding: 35px 30px;
            text-align: center;
        }
        .login-header .icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
            color: #a7f3d0;
        }
        .login-header h2 {
            margin: 0 0 6px 0;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .login-header p {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .login-body {
            padding: 35px 30px;
        }
        .alert-error {
            background-color: #fef2f2;
            border-left: 4px solid #ef4444;
            color: #b91c1c;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .credentials-hint {
            background: #f0fdf4;
            border: 1px dashed #86efac;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 22px;
            font-size: 0.85rem;
            color: #166534;
        }
        .credentials-hint strong {
            color: #14532d;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            color: #374151;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }
        .input-wrap input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .input-wrap input:focus {
            outline: none;
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #059669;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-submit:hover {
            background: #047857;
        }
        .login-footer {
            text-align: center;
            margin-top: 25px;
            border-top: 1px solid #f3f4f6;
            padding-top: 18px;
        }
        .login-footer a {
            color: #059669;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="icon"><i class="fa-solid fa-seedling"></i></div>
            <h2>Torent Distribution</h2>
            <p>Panou de Administrare Webshop</p>
        </div>

        <div class="login-body">
            {% if error %}
            <div class="alert-error">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <div class="credentials-hint">
                <i class="fa-solid fa-key"></i> Date acces implicite:<br>
                Utilizator: <strong>admin</strong> | Parolă: <strong>adminpassword2026</strong>
            </div>

            <form method="POST" action="/admin/login">
                <div class="form-group">
                    <label for="username">Nume Utilizator</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" name="username" value="admin" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Parolă de Acces</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" value="adminpassword2026" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-right-to-bracket"></i> Autentificare în Panou
                </button>
            </form>

            <div class="login-footer">
                <a href="/"><i class="fa-solid fa-arrow-left"></i> Înapoi la Magazinul Public</a>
            </div>
        </div>
    </div>
</body>
</html>
